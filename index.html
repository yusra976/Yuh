<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7ef"><meta name="apple-mobile-web-app-capable" content="yes"><title>WithEase</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7ef;color:#302b32;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:650px;margin:auto;padding:22px 18px 115px}header{display:flex;justify-content:space-between;align-items:center}header b{font:italic 29px Georgia;color:#793e51}h1,h2,h3{font-family:Georgia;font-weight:normal;margin:0 0 10px}h1{font-size:36px;line-height:1.1}h2{font-size:25px}h3{font-size:20px}p{margin:8px 0}small,.muted{color:#75646e}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:#793e51;color:white}button.light{background:#f1e4e8;color:#793e51}button.tiny{padding:5px 10px;font-size:13px}input:not([type=checkbox]),textarea,select{width:100%;border:1px solid #e1d4d7;border-radius:10px;padding:10px;background:#fff;color:#302b32;margin:4px 0 8px}textarea{min-height:85px;resize:vertical}.card{background:#fff;border:1px solid #eedfe1;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #793e5107}.hero{background:#e8b9bc;padding:24px;border-radius:24px;margin:18px 0;position:relative;overflow:hidden}.hero:after{content:'✳';font-size:110px;color:#f7d5cf;position:absolute;right:-10px;top:-28px;pointer-events:none}.hero>*{position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#793e51}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f1e9e8}.task:last-child{border:0}.task span{flex:1}.task input{width:21px;height:21px;accent-color:#793e51;flex:none}.task.done span{text-decoration:line-through;color:#817780}.bar{height:8px;background:#f0e4e4;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#793e51;border-radius:20px}.green{background:#e1ead8}.yellow{background:#f9e9bb}.blue{background:#e1e7fa}.pink{background:#f5dce4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.photo{width:100%;height:135px;object-fit:cover;border-radius:14px;background:#edcfc6}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf9;border-top:1px solid #eadce0;display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;color:#75646e;font-size:11px;min-width:19%;max-width:120px;padding:6px 2px}.nav button.active{color:#793e51;font-weight:700;background:#f5e6e9}.nav b{display:block;font-size:21px;font-weight:normal}.pill{display:inline-block;background:#fff9;padding:5px 9px;border-radius:20px;font-size:12px}.weekdays{display:flex;gap:5px;overflow:auto}.weekdays button{flex:1;padding:8px 4px;background:#f1e4e8;color:#793e51}.weekdays button.active{background:#793e51;color:white}a{color:#793e51}details summary{cursor:pointer;font-weight:650}dialog{width:min(92%,480px);border:0;border-radius:22px;padding:22px;color:#302b32}dialog::backdrop{background:#302b3277}.recipe{padding:0;overflow:hidden}.recipe .inside{padding:14px}.recipe .photo{border-radius:0;height:145px}.sp{margin-top:14px}.art{height:100px;border-radius:15px;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle at 70% 20%,#fff8,transparent 50%)}.linkcard{text-decoration:none;color:inherit;display:block}.linkcard p{font-weight:650}.subnav{display:flex;gap:6px;overflow:auto}.subnav button{white-space:nowrap}.subnav button.active{background:#793e51;color:white}.notice{font-size:13px;color:#75646e} .empty{padding:12px;color:#75646e} </style></head><body><main><header><b>withEase<span style="color:#b78a65">.</span></b><button class="light tiny" onclick="settings()">⚙ Settings</button></header><div id="app"></div></main><nav class="nav" id="nav"></nav><dialog id="modal"></dialog><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='withease-v3';const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const now=new Date(),today=dateKey(now);function monday(d){let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}let base=monday(now),selected=today,tab='Today',sub='Meals';const defaults={daily:{},weeks:{},supp:[],habits:['Eat nourishing meals','Drink water','Read Quran or make dua'],schedule:['Lower-body strength','Yoga sculpt','Rest / meal refresh','Upper-body strength','Rest / finances','Yoga sculpt or Pilates','Hair day + meal prep'],workouts:[true,true,false,true,false,true,false],recipes:[['Chicken shawarma bowls','30 min','Halal chicken, rice, cucumber, tomato, Greek yogurt, lemon, spices','Season chicken with cumin, paprika and garlic; cook to 165°F. Serve over rice with chopped vegetables and lemon yogurt.','photo-1546069901-ba9599a7e63c'],['Salmon rice bowls','25 min','Salmon, rice, edamame, cucumber, lemon','Bake salmon to 145°F. Add rice, edamame, cucumber and lemon.','photo-1467003909585-2f8a72700288'],['Chickpea pasta salad','20 min','Pasta, chickpeas, cucumber, tomatoes, olive oil, lemon','Cook pasta, rinse chickpeas, chop vegetables and toss with lemon and oil.','photo-1512621776951-a57141f2eefd'],['Beef sweet potato bowls','30 min','Halal ground beef, sweet potato, avocado, spices','Roast cubed sweet potato; cook beef to 160°F. Assemble with avocado.','photo-1547592180-85f173990554'],['Chicken wraps','15 min','Cooked halal chicken, tortilla, romaine, yogurt, lemon','Mix yogurt and lemon, fill tortilla with chicken and romaine, roll.','photo-1550547660-d9450f859349'],['Berry overnight oats','5 min','Oats, milk, yogurt, chia, berries','Mix in a jar and refrigerate overnight.','photo-1517673400267-0251440c45dc']],journal:{},links:[],business:['Choose business structure','Register if needed','Get free EIN from IRS','Finish Shopify listings','Test checkout and shipping','Soft launch'],businessDone:{}};let S;try{S={...defaults,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{S=structuredClone(defaults)}function save(){try{localStorage.setItem(key,JSON.stringify(S))}catch{alert('Storage unavailable. Export a backup in Settings.')}}function day(k=selected){return S.daily[k]??=( {goals:['','',''],checks:{},mood:'',note:''})}function week(){let k=dateKey(base);return S.weeks[k]??={goal:'',done:false,meals:{},groceries:['Halal chicken','Salmon','Rice','Greek yogurt','Cucumber','Berries','Oats'].map(t=>({t,c:false}))}}function dates(){return days.map((_,i)=>{let d=new Date(base);d.setDate(d.getDate()+i);return dateKey(d)})}function fmt(k){return new Date(k+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}function change(fn){fn();save();render()}function task(label,k,checked,action){return `<label class="task ${checked?'done':''}"><input type="checkbox" ${checked?'checked':''} onchange="${action}"><span>${esc(label)}</span></label>`}function dcheck(k){change(()=>day().checks[k]=!day().checks[k])}function dtask(t,k){return task(t,k,day().checks[k],`dcheck('${k}')`)}function pic(id){return `https://images.unsplash.com/${id}?auto=format&fit=crop&w=650&q=75`}function photo(id,alt){return `<img class="photo" loading="lazy" src="${pic(id)}" alt="${esc(alt)}" onerror="this.style.display='none'">`}function go(t){tab=t;render();window.scrollTo(0,0)}function render(){ $('nav').innerHTML=['Today','This Week','Wellness','Vision','Journal'].map((t,i)=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><b>${['⌂','▦','♡','✳','✎'][i]}</b>${t}</button>`).join('');$('app').innerHTML=({Today:home,'This Week':weekly,Wellness:wellness,Vision:vision,Journal:journal}[tab])()}function edit(title,html,fn){$('modal').innerHTML=`<h2>${title}</h2>${html}<div class="row sp"><button class="light" onclick="document.getElementById('modal').close()">Cancel</button><button id="confirm">Save</button></div>`;$('confirm').onclick=()=>{if(fn()===false)return;save();$('modal').close();render()};$('modal').showModal()}function goals(){edit('Your three priorities',day().goals.map((g,i)=>`<label>Goal ${i+1}<input id="g${i}" value="${esc(g)}" placeholder="One small, specific action"></label>`).join(''),()=>{let d=day();d.goals=d.goals.map((g,i)=>{let v=$('g'+i).value.trim();if(v!==g)delete d.checks['g'+i];return v})})}function goalWeek(){edit('One goal for this week',`<textarea id="wg" placeholder="e.g. Submit my EIN application">${esc(week().goal)}</textarea>`,()=>{if(week().goal!== $('wg').value.trim())week().done=false;week().goal=$('wg').value.trim()})}function selectDay(k){selected=k;render()}function home(){let d=day(),w=week(),i=(new Date(selected+'T12:00:00').getDay()+6)%7;return `<div class="hero"><div class="eyebrow">${fmt(selected)}</div><h1>Make today<br>count, gently.</h1><p>One day. Three priorities. A little barakah.</p></div><div class="weekdays">${dates().map((k,i)=>`<button class="${k===selected?'active':''}" onclick="selectDay('${k}')">${days[i]}<br>${Number(k.slice(-2))}</button>`).join('')}</div><div class="card yellow"><div class="row"><div class="eyebrow">Weekly focus</div><button class="light tiny" onclick="goalWeek()">Edit</button></div><h3>${esc(w.goal||'Choose one meaningful goal')}</h3>${w.goal?task('Weekly goal complete','',w.done,'change(()=>week().done=!week().done)'):''}</div><div class="card"><div class="row"><h2>Today's big three</h2><button class="light tiny" onclick="goals()">Edit</button></div>${d.goals.map((g,i)=>g?dtask(g,'g'+i):`<div class="task muted">${i+1}. Add a priority</div>`).join('')}<div class="bar"><i style="width:${d.goals.filter((g,i)=>g&&d.checks['g'+i]).length/3*100}%"></i></div></div><div class="card green"><h2>Deen</h2><p class="muted">Return with intention, not guilt.</p>${['Fajr','Dhuhr','Asr','Maghrib','Isha'].map((t,i)=>dtask(t,'p'+i)).join('')}</div><div class="card"><h2>Daily care</h2>${S.habits.map((t,i)=>dtask(t,'h:'+encodeURIComponent(t))).join('')}${S.supp.map((s,i)=>dtask(s.name+' · '+s.time,'s:'+s.id)).join('')}${S.workouts[i]?dtask(S.schedule[i],'workout'):''}${i===6?dtask('Sunday hair care','hair')+dtask('Meal prep','prep'):''}<button class="light" onclick="go('Wellness')">Manage wellness</button></div>`}function shift(n){base.setDate(base.getDate()+7*n);selected=dateKey(base);render()}function weekly(){let w=week(),ds=dates();return `<div class="hero"><div class="eyebrow">Plan less, do more</div><h1>This week.</h1><p>One meaningful outcome is enough.</p></div><div class="row"><button class="light" onclick="shift(-1)">‹</button><b>${ds[0]} – ${ds[6].slice(5)}</b><button class="light" onclick="shift(1)">›</button></div><div class="card yellow"><div class="row"><h2>Weekly goal</h2><button class="light tiny" onclick="goalWeek()">Edit</button></div><p>${esc(w.goal||'Set your focus for the week.')}</p>${w.goal?task('Complete','',w.done,'change(()=>week().done=!week().done)'):''}</div><div class="card"><div class="row"><h2>Weekly rhythm</h2><button class="light tiny" onclick="scheduleEdit()">Edit</button></div>${ds.map((k,i)=>`<div class="task"><b>${days[i]}</b><span>${esc(S.schedule[i])}</span><button class="light tiny" onclick="selected='${k}';go('Today')">View</button></div>`).join('')}</div><div class="card pink"><h2>Sunday reset</h2>${['Groceries','Meal prep','Hair care','Laundry & outfits','Plan the week'].map((t,i)=>task(t,'',day(ds[6]).checks['reset'+i],`change(()=>day('${ds[6]}').checks.reset${i}=!day('${ds[6]}').checks.reset${i})`)).join('')}</div>`}function scheduleEdit(){edit('Edit weekly rhythm',days.map((t,i)=>`<label>${t}<input id="sc${i}" value="${esc(S.schedule[i])}"></label><label><input type="checkbox" id="wo${i}" ${S.workouts[i]?'checked':''}> Workout day</label><br><br>`).join(''),()=>{S.schedule=days.map((_,i)=>$('sc'+i).value);S.workouts=days.map((_,i)=>$('wo'+i).checked)})}function wellness(){return `<div class="hero green"><div class="eyebrow">Care, not punishment</div><h1>Wellness.</h1><p>Fuel your body. Move with joy.</p></div><div class="subnav">${['Meals','Movement','Supplements','Hair'].map(t=>`<button class="light ${sub===t?'active':''}" onclick="sub='${t}';render()">${t}</button>`).join('')}</div>${({Meals:meals,Movement:movement,Supplements:supplements,Hair:hair}[sub])()}`}function meals(){let w=week();return `<div class="card"><div class="row"><h2>Meal plan</h2><button class="light tiny" onclick="mealEdit()">Edit</button></div>${dates().map((k,i)=>`<div class="task"><b>${days[i]}</b><span>${esc(w.meals[k]||'Not planned')}</span></div>`).join('')}</div><div class="row"><h2>Recipe library</h2><button class="light tiny" onclick="recipeEdit(-1)">+ Recipe</button></div><div class="grid">${S.recipes.map((r,i)=>`<div class="card recipe">${r[4]?photo(r[4],r[0]):'<div class="art green">🥗</div>'}<div class="inside"><small>${esc(r[1])}</small><h3>${esc(r[0])}</h3><button class="light tiny" onclick="recipeView(${i})">View recipe</button></div></div>`).join('')}</div><div class="card"><div class="row"><h2>Grocery list</h2><button class="light tiny" onclick="groceryAdd()">+ Item</button></div>${w.groceries.map((g,i)=>task(g.t,'',g.c,`change(()=>week().groceries[${i}].c=!week().groceries[${i}].c)`)).join('')}<button class="light tiny" onclick="change(()=>week().groceries=week().groceries.filter(g=>!g.c))">Clear checked</button><p class="notice">Aldi / Trader Joe’s: produce, grains, dairy. Buy certified halal meat separately. Check sauces, cheese and gelatin. Refrigerate cooked meals 3–4 days or freeze later portions.</p></div>`}function mealEdit(){edit('Plan your meals',dates().map((k,i)=>`<label>${days[i]}<input id="m${i}" value="${esc(week().meals[k]||'')}" placeholder="Breakfast / lunch / dinner"></label>`).join(''),()=>dates().forEach((k,i)=>week().meals[k]=$('m'+i).value))}function groceryAdd(){edit('Add groceries','<textarea id="gro" placeholder="One item per line"></textarea>',()=>$('gro').value.split('\n').filter(x=>x.trim()).forEach(t=>week().groceries.push({t:t.trim(),c:false})))}function recipeView(i){let r=S.recipes[i];edit(esc(r[0]),`<p>${esc(r[1])}</p><h3>Ingredients</h3><p>${esc(r[2])}</p><h3>Method</h3><p>${esc(r[3])}</p><button class="light" onclick="$('modal').close();recipeEdit(${i})">Edit recipe</button>`,()=>{})}function recipeEdit(i){let r=S.recipes[i]||['','','','',''];edit('Recipe',r.slice(0,4).map((v,j)=>`<label>${['Name','Time','Ingredients','Method'][j]}<${j>1?'textarea':'input'} id="r${j}" ${j>1?`>${esc(v)}</textarea>`:`value="${esc(v)}">`}</label>`).join('')+(i>=0?`<button class="light" onclick="if(confirm('Delete recipe?')){S.recipes.splice(${i},1);save();$('modal').close();render()}">Delete recipe</button>`:''),()=>{if(!$('r0').value.trim())return false;let a=[0,1,2,3].map(j=>$('r'+j).value);a.push(r[4]);if(i<0)S.recipes.push(a);else S.recipes[i]=a})}function movement(){let ds=dates(),n=ds.filter(k=>day(k).checks.workout).length;return `<div class="card blue"><h2>${n} / 4 workouts</h2><div class="bar"><i style="width:${Math.min(n/4,1)*100}%"></i></div><p>Four is the goal. Recovery counts as care too.</p></div><div class="card"><div class="row"><h2>Movement plan</h2><button class="light tiny" onclick="scheduleEdit()">Edit</button></div>${ds.map((k,i)=>task(days[i]+' · '+S.schedule[i],'',day(k).checks.workout,`change(()=>day('${k}').checks.workout=!day('${k}').checks.workout)`)).join('')}</div><div class="card">${photo('photo-1518611012118-696072aa579a','Workout inspiration')}<p><a href="https://www.youtube.com/results?search_query=beginner+yoga+sculpt+workout" target="_blank" rel="noopener">Free yoga sculpt workouts</a></p></div>`}function supplements(){return `<div class="card pink"><h2>My supplements</h2><p>Track what you already take or what your clinician recommends. No automatic doses.</p><button onclick="suppEdit(-1)">+ Add supplement</button></div><div class="card">${S.supp.map((s,i)=>`<div class="row task"><div><b>${esc(s.name)}</b><br><small>${esc(s.dose)} · ${esc(s.time)}</small></div><button class="light tiny" onclick="suppEdit(${i})">Edit</button></div>`).join('')||'<p class="muted">Nothing added yet.</p>'}<p class="notice">Book a checkup and ask about your individual needs, interactions and halal-compatible formulations before starting supplements.</p></div>`}function suppEdit(i){let s=S.supp[i]||{name:'',dose:'',time:'Morning',id:Date.now()};edit('Supplement',`<label>Name<input id="sn" value="${esc(s.name)}"></label><label>Clinician-approved dose<input id="sd" value="${esc(s.dose)}"></label><label>Time<input id="st" value="${esc(s.time)}"></label>${i>=0?`<button class="light" onclick="S.supp.splice(${i},1);save();$('modal').close();render()">Remove</button>`:''}`,()=>{if(!$('sn').value.trim())return false;let x={id:s.id,name:$('sn').value,dose:$('sd').value,time:$('st').value};if(i<0)S.supp.push(x);else S.supp[i]=x})}function hair(){let k=dates()[6];return `<div class="card pink"><h2>Sunday hair ritual</h2><p>Make it a date with yourself.</p>${['Pre-wash / detangle','Cleanse','Condition','Moisturize and style','Protect hair overnight'].map((t,i)=>task(t,'',day(k).checks['hair'+i],`change(()=>day('${k}').checks.hair${i}=!day('${k}').checks.hair${i})`)).join('')}<a href="https://www.pinterest.com/search/pins/?q=natural%20hair%20wash%20day%20routine" target="_blank" rel="noopener">Hair day inspiration ↗</a></div>`}const boards=[['Sunday reset','sunday reset aesthetic','🛁','pink','photo-1441974231531-c6227db76b6e'],['Deen & peace','muslim prayer corner aesthetic','🌙','green',''],['Meal prep','healthy halal meal prep aesthetic','🥗','yellow','photo-1490645935967-10de6ba17061'],['Movement','pilates yoga sculpt aesthetic','🧘🏽‍♀️','blue','photo-1544367567-0f2fcb009e0b'],['Jewelry brand','gold jewelry packaging aesthetic','💍','pink','photo-1515562141207-7a88fb7ce338'],['Everyday joy','modest lifestyle photography aesthetic','🌷','yellow','photo-1490750967868-88aa4486c946']];function vision(){return `<div class="hero"><div class="eyebrow">Inspiration, not comparison</div><h1>Your vision.</h1><p>Make room for the life you already have.</p></div><div class="grid">${boards.map(b=>`<a class="card linkcard ${b[3]}" target="_blank" rel="noopener" href="https://www.pinterest.com/search/pins/?q=${encodeURIComponent(b[1])}">${b[4]?photo(b[4],b[0]):`<div class="art">${b[2]}</div>`}<p>${b[0]} ↗</p><small>Pinterest inspiration</small></a>`).join('')}</div><div class="card"><div class="row"><h2>My saved links</h2><button class="light tiny" onclick="linkAdd()">+ Link</button></div>${S.links.map((l,i)=>`<div class="task"><span><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a></span><button class="light tiny" onclick="change(()=>S.links.splice(${i},1))">Remove</button></div>`).join('')}</div><div class="card yellow"><h2>Jewelry launch</h2>${S.business.map((t,i)=>task(t,'',S.businessDone[i],`change(()=>S.businessDone[${i}]=!S.businessDone[${i}])`)).join('')}<a href="https://www.irs.gov/businesses/small-businesses-self-employed/get-an-employer-identification-number" target="_blank" rel="noopener">Free EIN application ↗</a></div>`}function linkAdd(){edit('Save inspiration','<input id="lt" placeholder="Title"><input id="lu" placeholder="https://...">',()=>{if(!/^https:\/\//i.test($('lu').value)){alert('Enter a valid HTTPS link');return false}S.links.push({title:$('lt').value||'Inspiration',url:$('lu').value})})}function journal(){let d=day();return `<div class="hero blue"><div class="eyebrow">A little honesty</div><h1>Come back to you.</h1><p>What made today fulfilling?</p></div><div class="card"><label>Date<input type="date" value="${selected}" onchange="selected=this.value;render()"></label><h2>How are you feeling?</h2><div class="subnav">${['Peaceful','Happy','Tired','Anxious','Heavy'].map(m=>`<button class="light ${d.mood===m?'active':''}" onclick="change(()=>day().mood='${m}')">${m}</button>`).join('')}</div><h3 class="sp">What do I need today?</h3><textarea id="jn" oninput="day().note=this.value;save()" placeholder="Write freely…">${esc(d.note)}</textarea><p class="notice">Saved on this device as you type.</p></div><div class="card"><h2>Past reflections</h2>${Object.keys(S.daily).filter(k=>S.daily[k].note).sort().reverse().map(k=>`<div class="task"><span>${fmt(k)}</span><button class="light tiny" onclick="selected='${k}';render()">Read</button></div>`).join('')||'<p class="muted">Your entries will appear here.</p>'}</div>`}function settings(){edit('Make it yours',`<h3>Daily habits</h3><textarea id="hb">${esc(S.habits.join('\n'))}</textarea><p class="notice">One habit per line. Your data stays in this browser; export backups regularly. This site is public but journal entries are not uploaded.</p><div class="row"><button class="light" onclick="exportData()">Export backup</button><button class="light" onclick="$('imp').click()">Import backup</button></div><input type="file" id="imp" hidden accept="application/json" onchange="importData(this)">`,()=>S.habits=$('hb').value.split('\n').map(x=>x.trim()).filter(Boolean))}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='withease-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(el){try{let v=JSON.parse(await el.files[0].text());if(!v||!v.daily||!v.weeks||!Array.isArray(v.recipes))throw Error();if(confirm('Replace current data with this backup?')){S={...defaults,...v};save();$('modal').close();render()}}catch{alert('Choose a valid WithEase v3 backup.')}}render();</script></body></html>
